[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentinel"
version = "0.1.0"
description = "A Windows-focused network security monitoring application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.8,<7",
    "psutil>=6.1,<8",
    "scapy>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-qt>=4.4,<5",
]

[project.scripts]
netsentinel = "netsentinel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netsentinel = ["infrastructure/sqlite/schema/*.sql"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = [
    "--strict-config",
    "--strict-markers",
    "-m",
    "not windows_live and not lab_live",
]
testpaths = ["tests"]
markers = [
    "windows_live: opt-in read-only Windows adapter tests and local loopback sockets",
    "lab_live: opt-in passive packet capture tests for an explicitly authorized lab network",
    "performance: deterministic offline burst and resource-bound validation",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentinel"
dynamic = ["version"]
description = "A Windows-focused network security monitoring application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.8,<7",
    "psutil>=6.1,<8",
    "scapy>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.3,<10",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.4,<5",
    "ruff>=0.16.9",
]
packaging = ["pyinstaller>=6.22,<7"]

[tool.setuptools.dynamic]
version = {attr = "netsentinel.version.__version__"}

[project.scripts]
netsentinel = "netsentinel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netsentinel = ["infrastructure/sqlite/schema/*.sql", "assets/*.ico"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = [
    "--strict-config",
    "--strict-markers",
    "-m",
    "not windows_live and not lab_live",
]
testpaths = ["tests"]
markers = [
    "windows_live: opt-in read-only Windows adapter tests and local loopback sockets",
    "lab_live: opt-in passive packet capture tests for an explicitly authorized lab network",
    "performance: deterministic offline burst and resource-bound validation",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = [
    "src/netsentinel/domain",
    "src/netsentinel/application/ports.py",
    "src/netsentinel/shared",
]
follow_imports = "silent"
ignore_missing_imports = true
show_error_codes = true

[tool.coverage.report]
fail_under = 85

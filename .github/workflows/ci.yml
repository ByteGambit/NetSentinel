name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, and dependency audit
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          python-version: "3.12"
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: .\.venv\Scripts\python.exe -m ruff check src tests packaging tools/localization.py
      - name: Type check portable contracts
        run: .\.venv\Scripts\python.exe -m mypy
      - name: Localization source and resource inventory
        run: .\.venv\Scripts\python.exe tools/localization.py check
      - name: Audit locked dependencies
        run: uv audit --locked --python-version 3.12 --python-platform windows

  tests:
    name: Offline tests and coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          python-version: "3.12"
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Unit, integration, and offscreen GUI tests
        run: .\.venv\Scripts\python.exe -m pytest -m "not windows_live and not lab_live and not live_threat_intel" --cov=netsentinel --cov-report=term-missing --cov-fail-under=85
